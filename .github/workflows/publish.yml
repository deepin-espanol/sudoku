name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-deb:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build .deb
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          linuxdeepin/deepin:crimson \
          bash -c "
            apt-get update && \
            apt-get install -y cmake qt6-base-dev qt6-multimedia-dev libdtk6widget-dev g++ lrelease && \
            cmake -B build -DCMAKE_BUILD_TYPE=Release && \
            cmake --build build -j\$(nproc) && \
            cmake --install build --prefix /tmp/pkg/usr && \
            mkdir -p /tmp/pkg/DEBIAN && \
            cat > /tmp/pkg/DEBIAN/control <<EOF
            Package: sudoku
            Version: 0.2.0
            Section: games
            Priority: optional
            Architecture: ${{ matrix.arch }}
            Maintainer: Deepin Developers <dev@deepin.org>
            Depends: libqt6widgets6, libqt6multimedia6, libdtk6widget6
            Description: Classic Sudoku puzzle game
             A classic Sudoku puzzle game for Deepin.
            EOF
            dpkg-deb --build /tmp/pkg /workspace/sudoku-${{ matrix.arch }}.deb
          "

    - name: Upload .deb
      uses: actions/upload-artifact@v4
      with:
        name: sudoku-${{ matrix.arch }}.deb
        path: sudoku-${{ matrix.arch }}.deb

  create-release:
    needs: build-deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          sudoku-amd64.deb/sudoku-amd64.deb
          sudoku-arm64.deb/sudoku-arm64.deb
        generate_release_notes: true
