version: "1"

package:
  id: org.deepinenespanol.sudoku
  name: Sudoku
  version: 0.2.2.0
  kind: app
  description: |
    Classic Sudoku with unique-solution puzzles for Deepin built with Qt6 and DTK6.

command:
  - /opt/apps/org.deepinenespanol.sudoku/files/bin/sudoku

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.dtk/25.2.2

# Se empaqueta el .deb ya compilado (el CI lo deja en debs/).
# Se lee de /project/debs/ porque ll-builder vacia linglong/sources.
build: |
  dpkg-deb -X /project/debs/sudoku_*.deb $PREFIX/
  mv $PREFIX/usr/bin $PREFIX/bin
  mv $PREFIX/usr/share $PREFIX/share
  rm -rf $PREFIX/usr
  mv $PREFIX/share/applications/sudoku.desktop $PREFIX/share/applications/org.deepinenespanol.sudoku.desktop
  sed -i 's#^Exec=.*#Exec=/opt/apps/org.deepinenespanol.sudoku/files/bin/sudoku#' \
      $PREFIX/share/applications/org.deepinenespanol.sudoku.desktop

sources: []
